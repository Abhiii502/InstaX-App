name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract InstaX project
        run: |
          if [ -f "InstaX-main.zip" ]; then
            unzip -o "InstaX-main.zip" -d temp
            cp -r temp/InstaX-main/. .
            rm -rf temp
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaX-APK
          path: app/build/outputs/apk/debug/*.apk
