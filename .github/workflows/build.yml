name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o InstaX-main.zip -d temp
          cp -r temp/InstaX-main/*.
          cp -r temp/InstaX-main/.*. 2>/dev/null || true
          rm -rf temp InstaX-main.zip InstaX-main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaX-APK
          path: app/build/outputs/apk/debug/*.apk
